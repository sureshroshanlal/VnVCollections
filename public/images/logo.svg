<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1228" />
      <stop offset="100%" stop-color="#4A0815" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Icon: Sacred Lotus Arch & Peacock Veena Motif -->
  <g transform="translate(15, 10)">
    <!-- Outer Ornamental Arch -->
    <path d="M 50 10 C 25 10, 10 32, 10 60 C 10 88, 30 98, 50 100 C 70 98, 90 88, 90 60 C 90 32, 75 10, 50 10 Z" 
          stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M 50 16 C 30 16, 16 35, 16 60 C 16 83, 33 93, 50 94 C 67 93, 84 83, 84 60 C 84 35, 70 16, 50 16 Z" 
          stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 3" fill="none" opacity="0.7" />

    <!-- Stylized Lotus / Kalash center -->
    <path d="M 50 32 C 55 42, 66 54, 62 68 C 58 80, 50 82, 50 82 C 50 82, 42 80, 38 68 C 34 54, 45 42, 50 32 Z" 
          fill="url(#goldGrad)" />
    <!-- Left petal -->
    <path d="M 50 50 C 40 45, 26 56, 32 72 C 37 81, 48 82, 48 82 C 48 82, 42 74, 42 66 C 42 58, 48 52, 50 50 Z" 
          fill="url(#goldGrad)" opacity="0.85" />
    <!-- Right petal -->
    <path d="M 50 50 C 60 45, 74 56, 68 72 C 63 81, 52 82, 52 82 C 52 82, 58 74, 58 66 C 58 58, 52 52, 50 50 Z" 
          fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Central Jewel dot -->
    <circle cx="50" cy="24" r="3.5" fill="url(#goldGrad)" />
    <circle cx="50" cy="90" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: Vaarahi Vaagdevi Collections -->
  <g transform="translate(130, 20)">
    <!-- Top Micro Tagline -->
    <text x="0" y="22" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="600" letter-spacing="5" fill="#C5A059" text-transform="uppercase">
      ROYAL HERITAGE WEAVES
    </text>

    <!-- Main Brand Name: VAARAHI VAAGDEVI -->
    <text x="0" y="56" font-family="'Playfair Display', 'Cinzel', serif" font-size="31" font-weight="700" letter-spacing="2.5" fill="url(#goldGrad)">
      VAARAHI VAAGDEVI
    </text>

    <!-- Subtitle: COLLECTIONS -->
    <text x="2" y="82" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="12" font-weight="500" letter-spacing="9" fill="#E6D3A3" opacity="0.95" text-transform="uppercase">
      C O L L E C T I O N S
    </text>
  </g>
</svg>
